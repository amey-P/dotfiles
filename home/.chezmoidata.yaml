# Single source of truth for everything the installer installs.
# Consumed by scripts/layers/*.sh via scripts/lib/packages.sh (read_list).
# Keep the shape flat: two levels max, plain scalar list items.
#
# Ownership: anything cargo can install is installed by cargo only. The OS
# lists hold the editors/shell/runtime plus the bootstrap deps cargo, rustup,
# chezmoi and age need. herdr is installed by its upstream script (01-os.sh).

packages:
  apt:
    - git
    - curl
    - gcc
    - pkg-config
    - libssl-dev
    - emacs
    - neovim
    - zsh
    - nodejs
    - fzf
    - age
  pacman:
    - git
    - curl
    - gcc
    - pkg-config
    - openssl
    - emacs
    - neovim
    - zsh
    - nodejs
    - fzf
    - age
  brew:
    - git
    - curl
    - gcc
    - pkg-config
    - openssl
    - emacs
    - neovim
    - zsh
    - node
    - fzf
    - age
  # Termux has no cargo layer, so the cargo tools come from pkg here.
  pkg:
    - git
    - curl
    - gcc
    - pkg-config
    - openssl
    - emacs
    - neovim
    - zsh
    - nodejs
    - fzf
    - age
    - fd
    - bat
    - ripgrep
    - gitui
    - yazi

cargo_tools:
  - fd-find
  - bat
  - gitui
  - yazi-fm
  - yazi-cli
  - ripgrep

npm_global:
  - "@anthropic-ai/claude-code"
  - "@mariozechner/pi-coding-agent"
