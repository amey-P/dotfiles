# Single source of truth for everything the installer installs.
# Consumed by scripts/layers/*.sh via scripts/lib/packages.sh (read_list).
# Keep the shape flat: two levels max, plain scalar list items.

packages:
  apt:
    - git
    - stow
    - curl
    - gcc
    - cmake
    - libssl-dev
    - pkg-config
    - lua5.1
    - liblua5.1-dev
    - luarocks
    - vim
    - emacs
    - neovim
    - universal-ctags
    - tmux
    - zsh
    - nodejs
    - ripgrep
    - neofetch
    - fzf
    - yazi
    - fd-find
    - python3-pip
    - age
  pacman:
    - git
    - stow
    - curl
    - gcc
    - cmake
    - openssl
    - pkg-config
    - luarocks
    - vim
    - emacs
    - neovim
    - ctags
    - tmux
    - zsh
    - nodejs
    - ripgrep
    - neofetch
    - fzf
    - yazi
    - python-pip
    - age
  brew:
    - git
    - curl
    - gcc
    - cmake
    - openssl
    - vim
    - emacs
    - neovim
    - tmux
    - zsh
    - node
    - ripgrep
    - bat
    - fd
    - fzf
    - eza
    - python3
    - age
  pkg:
    - git
    - curl
    - gcc
    - cmake
    - vim
    - neovim
    - tmux
    - zsh
    - nodejs
    - ripgrep
    - fzf
    - fd
    - bat
    - python

cargo_tools:
  common:
    - eza
    - bat
    - zoxide
    - macchina
  linux:
    - nu
    - fd-find
  darwin:
    - nu

npm_global:
  - "@mariozechner/pi-coding-agent"
  - "@anthropic-ai/claude-code"
  - opencode-ai

# Needed by scripts/tui.py
pip_packages:
  - blessed
